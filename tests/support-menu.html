<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Support menu tests</title>
  <style>
    body { font: 13px/1.5 system-ui, sans-serif; padding: 16px; }
    .pass { color: #1A7F37; }
    .fail { color: #CF222E; }
    iframe { width: 820px; height: 640px; border: 1px solid #ccc; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Support menu</h1>
  <p id="summary">Running...</p>
  <ol id="results"></ol>
  <iframe id="frame" title="Popup under test"></iframe>

  <script>
    // Drives the real popup.html in an iframe through DOM events and checks
    // what the user would see. Serve the project folder (.claude/launch.json
    // runs it on port 3456) and open /tests/support-menu.html.
    // Results also land on window.testResults.
    const STORE_KEY = 'alphabetizer-state';
    const AMOUNTS = ['2', '5', '10'];
    // The manifest as it was before this feature, apart from the version:
    // any new key, permission or policy fails. A new permission warns users
    // on update and can disable the extension until they accept it.
    const MANIFEST = {
      manifest_version: 3,
      name: 'Alphabetizer',
      version: '2.3',
      description: 'Sort text lines instantly with language-aware alphabetizing, dedupe, find and replace, and compare.',
      icons: { 48: 'icon48.png', 128: 'icon128.png' },
      action: { default_icon: 'icon48.png', default_popup: 'popup.html' },
      background: { service_worker: 'background.js' },
      permissions: ['storage', 'contextMenus', 'scripting', 'activeTab'],
      commands: {
        _execute_action: {
          suggested_key: { default: 'Ctrl+Shift+L' },
          description: 'Open Alphabetizer'
        }
      }
    };
    // Built from their codes, like ACUTE in sort-from-character.html, so this
    // file holds no dash characters itself.
    const DASHES = new RegExp('[' + String.fromCharCode(0x2013, 0x2014) + ']');
    const SOURCES = ['../popup.html', '../popup.css', '../popup.js', '../manifest.json', 'support-menu.html'];
    const frame = document.getElementById('frame');
    let doc, win;
    // Whether the popup cancelled the last link click itself.
    let lastLinkClickBlocked = null;
    const $ = id => doc.getElementById(id);
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
    const source = async path => (await fetch(`${path}?t=${Date.now()}`)).text();

    function navigate(src) {
      return new Promise(resolve => {
        frame.onload = () => resolve();
        frame.src = src;
      });
    }

    async function load() {
      await navigate('about:blank');
      localStorage.removeItem(STORE_KEY);
      await navigate(`../popup.html?t=${Date.now()}`);
      win = frame.contentWindow;
      doc = frame.contentDocument;
      lastLinkClickBlocked = null;
      // Links open a new tab. This runs last (bubble phase on the window), so
      // it records whether the popup itself blocked the click, then cancels
      // the navigation so the test page stays put.
      win.addEventListener('click', e => {
        if (!(e.target.closest && e.target.closest('a[target="_blank"]'))) return;
        lastLinkClickBlocked = e.defaultPrevented;
        e.preventDefault();
      });
      await wait(50);
    }

    // Returns false when the popup cancelled the key's default action.
    function key(el, k) {
      return el.dispatchEvent(new win.KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true }));
    }
    const heart = () => $('supportBtn');
    const menu = () => $('supportMenu');
    const items = () => [...doc.querySelectorAll('#supportMenu .support-item')];
    const isShown = el => win.getComputedStyle(el).display !== 'none';
    const focused = () => doc.activeElement;
    const expanded = () => heart().getAttribute('aria-expanded');

    // Every CSS rule in the popup, including the ones inside @media blocks.
    function cssRules() {
      const out = [];
      const walk = (rules, media) => [...rules].forEach(r => {
        if (r.cssRules && !r.selectorText) walk(r.cssRules, r.conditionText || media);
        else if (r.selectorText) out.push({ rule: r, media });
      });
      [...doc.styleSheets].forEach(sheet => walk(sheet.cssRules, ''));
      return out;
    }

    function eq(actual, expected) {
      const a = JSON.stringify(actual), e = JSON.stringify(expected);
      if (a !== e) throw new Error(`expected ${e}, got ${a}`);
    }
    function ok(value, message) { if (!value) throw new Error(message); }
    // eq would call any two elements equal (both stringify to {}), so
    // elements are compared by identity.
    const describe = el => !el ? String(el) : el.id ? `#${el.id}` : el.dataset && el.dataset.amount ? `$${el.dataset.amount}` : el.tagName;
    function same(actual, expected) {
      if (actual !== expected) throw new Error(`expected ${describe(expected)}, got ${describe(actual)}`);
    }

    const tests = [];
    const test = (name, fn) => tests.push({ name, fn });

    test('the heart sits right after the help button and starts closed', async () => {
      ok(heart(), 'no support button (#supportBtn)');
      eq($('helpBtn').nextElementSibling.id, 'supportWrap');
      eq(heart().getAttribute('aria-label'), 'Support Alphabetizer');
      eq(expanded(), 'false');
      eq(heart().getAttribute('aria-controls'), 'supportMenu');
      eq(isShown(menu()), false);
    });

    test('clicking the heart opens the menu, clicking again closes it', async () => {
      heart().click();
      eq(isShown(menu()), true);
      eq(expanded(), 'true');
      heart().click();
      eq(isShown(menu()), false);
      eq(expanded(), 'false');
    });

    test('the menu lists $2, $5 and $10 with the one-time note', async () => {
      heart().click();
      eq(items().map(a => a.firstElementChild.firstChild.textContent), ['$2', '$5', '$10']);
      eq($('supportNote').textContent, 'One-time, via Whop. Everything stays free.');
      eq($('supportTitle').textContent, 'Support Alphabetizer');
    });

    test('each amount links to its own https Whop URL from SUPPORT_LINKS', async () => {
      const links = win.eval('SUPPORT_LINKS');
      eq(Object.keys(links), AMOUNTS);
      eq(items().map(a => a.dataset.amount), AMOUNTS);
      items().forEach(a => {
        eq(a.getAttribute('href'), links[a.dataset.amount]);
        ok(/^https:\/\/whop\.com\//.test(a.href), `not a whop.com https link: ${a.href}`);
      });
      eq(new Set(items().map(a => a.href)).size, 3);
    });

    test('the links live only in SUPPORT_LINKS, so changing them is a one-line edit', async () => {
      const html = await source('../popup.html');
      ok(!html.includes('whop.com'), 'popup.html has a hard-coded Whop URL');
      const markup = new DOMParser().parseFromString(html, 'text/html');
      markup.querySelectorAll('.support-item').forEach(a => {
        ok(!a.hasAttribute('href'), 'a .support-item has an href in the markup');
      });
      const js = await source('../popup.js');
      eq((js.match(/https:\/\/whop\.com/g) || []).length, AMOUNTS.length);
    });

    test('links open in a new tab without an opener or referrer', async () => {
      items().forEach(a => {
        eq(a.getAttribute('target'), '_blank');
        eq(a.getAttribute('rel').split(' ').sort(), ['noopener', 'noreferrer']);
      });
    });

    test('screen readers hear where each link goes', async () => {
      items().forEach(a => {
        eq(a.querySelector('.sr-only').textContent, ', opens Whop in a new tab');
        eq(a.getAttribute('aria-describedby'), 'supportNote');
      });
    });

    test('Tab goes from the heart straight into the amounts', async () => {
      heart().click();
      same(heart().nextElementSibling, menu());
      const tabbable = [...doc.querySelectorAll('a[href], button, input, textarea, [tabindex]')]
        .filter(el => el.tabIndex >= 0 && !el.disabled && el.getClientRects().length > 0);
      eq(tabbable.indexOf(items()[0]), tabbable.indexOf(heart()) + 1);
    });

    test('Escape closes the menu, puts focus back on the heart, and does not reach Chrome', async () => {
      heart().click();
      items()[1].focus();
      // An Escape the page leaves alone closes the whole extension popup.
      eq(key(items()[1], 'Escape'), false);
      eq(isShown(menu()), false);
      eq(expanded(), 'false');
      same(focused(), heart());
    });

    test('a click anywhere else closes the menu', async () => {
      heart().click();
      $('textA').click();
      eq(isShown(menu()), false);
      eq(expanded(), 'false');
    });

    test('a click on the menu padding keeps it open', async () => {
      // What a real click does: the heart takes focus, then the panel does.
      heart().focus();
      heart().click();
      menu().focus();
      same(focused(), menu());
      menu().click();
      eq(isShown(menu()), true);
      eq(expanded(), 'true');
    });

    test('moving focus out of the menu closes it', async () => {
      heart().click();
      items()[0].focus();
      $('textA').focus();
      eq(isShown(menu()), false);
      eq(expanded(), 'false');
    });

    test('ArrowDown on the heart opens the menu on the first amount', async () => {
      heart().focus();
      eq(key(heart(), 'ArrowDown'), false);
      eq(isShown(menu()), true);
      eq(expanded(), 'true');
      same(focused(), items()[0]);
    });

    test('arrow keys, Home and End move through the amounts, stop at the ends, and never scroll', async () => {
      heart().focus();
      key(heart(), 'ArrowDown');
      eq(key(focused(), 'ArrowDown'), false);
      same(focused(), items()[1]);
      key(focused(), 'ArrowDown');
      key(focused(), 'ArrowDown');
      same(focused(), items()[2]);
      eq(key(focused(), 'ArrowUp'), false);
      same(focused(), items()[1]);
      eq(key(focused(), 'Home'), false);
      same(focused(), items()[0]);
      key(focused(), 'ArrowUp');
      same(focused(), items()[0]);
      eq(key(focused(), 'End'), false);
      same(focused(), items()[2]);
    });

    test('picking an amount lets the link open, closes the menu and refocuses the heart', async () => {
      heart().click();
      items()[2].click();
      eq(lastLinkClickBlocked, false);
      eq(isShown(menu()), false);
      eq(expanded(), 'false');
      same(focused(), heart());
    });

    test('opening Help closes the menu, and Escape still closes Help', async () => {
      heart().click();
      heart().focus();
      $('helpBtn').click();
      eq(isShown(menu()), false);
      eq(expanded(), 'false');
      eq($('helpModal').classList.contains('hidden'), false);
      key(focused(), 'Escape');
      eq($('helpModal').classList.contains('hidden'), true);
    });

    test('the Transform dropdown and the support menu never stay open together', async () => {
      $('settingsBtn').click();
      heart().click();
      doc.querySelector('#transformDd .dd-trigger').click();
      eq(isShown(menu()), false);
      eq($('transformDd').classList.contains('open'), true);
    });

    test('sorting still works with the menu in the header', async () => {
      $('textA').value = 'pear\napple\nbanana';
      $('textA').dispatchEvent(new win.Event('input', { bubbles: true }));
      $('primaryBtn').click();
      eq($('textA').value, 'apple\nbanana\npear');
    });

    test('the menu floats on --float, not an app surface', async () => {
      heart().click();
      const probe = doc.createElement('div');
      probe.style.background = 'var(--float)';
      doc.body.appendChild(probe);
      const float = win.getComputedStyle(probe).backgroundColor;
      probe.remove();
      eq(win.getComputedStyle(menu()).backgroundColor, float);
    });

    test('in both themes, every background on the panel comes from --float or --tip-bg', async () => {
      // The page runs in one color scheme, so read the rules for the other too.
      const panelRules = cssRules().filter(({ rule }) =>
        /support-(menu|wrap)/.test(rule.selectorText) && !/support-item/.test(rule.selectorText));
      ok(panelRules.length > 0, 'no CSS rules for the support panel');
      panelRules.forEach(({ rule, media }) => {
        ['background', 'background-color'].forEach(prop => {
          const value = rule.style.getPropertyValue(prop);
          if (value) {
            ok(/var\(--(float|tip-bg)\)/.test(value),
              `${rule.selectorText}${media ? ` in ${media}` : ''} sets ${prop}: ${value}`);
          }
        });
      });
    });

    test('the open menu stays inside the 350px popup', async () => {
      heart().click();
      const box = menu().getBoundingClientRect();
      ok(box.left >= 0 && box.right <= doc.body.clientWidth,
        `menu spans ${Math.round(box.left)} to ${Math.round(box.right)}, popup is ${doc.body.clientWidth}`);
    });

    test('Undo and Copy keep their place at the right of the header', async () => {
      const head = doc.querySelector('.popup-head').getBoundingClientRect();
      const controls = doc.querySelector('.head-controls').getBoundingClientRect();
      eq(Math.round(controls.right), Math.round(head.right));
      eq(Math.round(controls.top), Math.round(head.top));
    });

    test('no new name reuses "tip", which belongs to the help tooltips', async () => {
      [$('supportWrap'), ...$('supportWrap').querySelectorAll('*')].forEach(el => {
        ok(!/tip/i.test(el.id), `id ${el.id} uses tip`);
        ok(![...el.classList].some(c => /tip/i.test(c)), `class on ${el.tagName} uses tip`);
      });
      cssRules().filter(({ rule }) => /support/.test(rule.selectorText)).forEach(({ rule }) => {
        ok(!/tip/i.test(rule.selectorText), `selector ${rule.selectorText} uses tip`);
        [...rule.style].forEach(prop => {
          ok(!/tip/i.test(prop), `${rule.selectorText} declares ${prop}`);
        });
      });
    });

    test('no em or en dashes in the popup, its copy or this test', async () => {
      const wrap = [$('supportWrap'), ...$('supportWrap').querySelectorAll('*')];
      wrap.forEach(el => [...el.attributes].forEach(attr => {
        ok(!DASHES.test(attr.value), `dash in ${attr.name} on ${el.tagName}`);
      }));
      ok(!DASHES.test($('supportWrap').textContent), 'dash in the support copy');
      for (const path of SOURCES) {
        ok(!DASHES.test(await source(path)), `dash in ${path}`);
      }
    });

    test('the manifest is 2.3 and otherwise unchanged: no new permissions', async () => {
      eq(JSON.parse(await source('../manifest.json')), MANIFEST);
    });

    (async () => {
      const list = document.getElementById('results');
      let failed = 0;
      for (const t of tests) {
        const li = document.createElement('li');
        try {
          await load();
          await t.fn();
          li.className = 'pass';
          li.textContent = `PASS  ${t.name}`;
        } catch (err) {
          failed++;
          li.className = 'fail';
          li.textContent = `FAIL  ${t.name}: ${err.message}`;
        }
        list.appendChild(li);
      }
      document.getElementById('summary').textContent = `${tests.length - failed} of ${tests.length} passed`;
      window.testResults = { passed: tests.length - failed, failed, lines: [...list.children].map(li => li.textContent) };
    })();
  </script>
</body>
</html>
