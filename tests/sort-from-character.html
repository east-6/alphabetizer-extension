<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sort from character tests</title>
  <style>
    body { font: 13px/1.5 system-ui, sans-serif; padding: 16px; }
    .pass { color: #1A7F37; }
    .fail { color: #CF222E; }
    iframe { width: 820px; height: 640px; border: 1px solid #ccc; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Sort from character</h1>
  <p id="summary">Running...</p>
  <ol id="results"></ol>
  <iframe id="frame" title="Popup under test"></iframe>

  <script>
    // Drives the real popup.html in an iframe through DOM events and checks
    // what the user would see. Serve the project folder (.claude/launch.json
    // runs it on port 3456) and open /tests/sort-from-character.html.
    // Results also land on window.testResults.
    const STORE_KEY = 'alphabetizer-state';
    const SAMPLE = 'Dr. Smith\nMr. Adams\nMs. Brown\nDr. Lee\nMr. Kent';
    // A combining acute accent, built from its code so no editor can quietly
    // normalize 'e' + ACUTE into the single precomposed letter.
    const ACUTE = String.fromCharCode(0x301);
    const frame = document.getElementById('frame');
    let doc, win;
    const $ = id => doc.getElementById(id);
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

    function navigate(src) {
      return new Promise(resolve => {
        frame.onload = () => resolve();
        frame.src = src;
      });
    }

    // Unloading first lets the popup flush its pending save, so clearing
    // storage afterwards really starts the next test fresh.
    async function load({ clear = true } = {}) {
      await navigate('about:blank');
      if (clear) localStorage.removeItem(STORE_KEY);
      await navigate(`../popup.html?t=${Date.now()}`);
      win = frame.contentWindow;
      doc = frame.contentDocument;
      await wait(50);
    }

    function fire(el, type) { el.dispatchEvent(new win.Event(type, { bubbles: true })); }
    function setValue(id, value) { $(id).value = value; fire($(id), 'input'); fire($(id), 'change'); }
    function setText(value) { setValue('textA', value); }
    function setFrom(n) {
      if (!$('sortFrom')) throw new Error('no Sort from character control (#sortFrom)');
      setValue('sortFrom', String(n));
    }
    function setTransform(value) {
      doc.querySelector('#transformDd .dd-trigger').click();
      doc.querySelector(`#transformDd .dd-item[data-value="${value}"]`).click();
    }
    function alphabetize() { $('primaryBtn').click(); return $('textA').value; }
    function boxes() { return [...doc.querySelectorAll('#backdropA .key')].map(el => el.textContent); }

    function eq(actual, expected) {
      const a = JSON.stringify(actual), e = JSON.stringify(expected);
      if (a !== e) throw new Error(`expected ${e}, got ${a}`);
    }

    const tests = [];
    const test = (name, fn) => tests.push({ name, fn });

    test('a fresh popup sorts whole lines and boxes nothing', async () => {
      setText(SAMPLE);
      eq(boxes(), []);
      eq(alphabetize(), 'Dr. Lee\nDr. Smith\nMr. Adams\nMr. Kent\nMs. Brown');
    });

    test('Z to A still reverses a whole-line sort', async () => {
      setText(SAMPLE);
      $('orderDesc').click();
      eq(alphabetize(), 'Ms. Brown\nMr. Kent\nMr. Adams\nDr. Smith\nDr. Lee');
    });

    test('Group by letter still uses first letters in a whole-line sort', async () => {
      setText(SAMPLE);
      $('swGroupLetter').click();
      eq(alphabetize(), 'D\nDr. Lee\nDr. Smith\nM\nMr. Adams\nMr. Kent\nMs. Brown');
    });

    test('sorts each line starting at the chosen character', async () => {
      setText(SAMPLE);
      setFrom(5);
      eq(alphabetize(), 'Mr. Adams\nMs. Brown\nMr. Kent\nDr. Lee\nDr. Smith');
    });

    test('counts from the first character, so different prefixes line up', async () => {
      setText('aaaaBz\nzzzzAa');
      setFrom(5);
      eq(alphabetize(), 'zzzzAa\naaaaBz');
    });

    test('ties are settled by the following characters, then the whole line', async () => {
      setText('Dr. Allen\nMs. Adams\nMr. Adams');
      setFrom(5);
      eq(alphabetize(), 'Mr. Adams\nMs. Adams\nDr. Allen');
    });

    test('boxes the chosen character on every line', async () => {
      setText(SAMPLE);
      setFrom(5);
      eq(boxes(), ['S', 'A', 'B', 'L', 'K']);
    });

    test('the box moves while a position is typed, before leaving the field', async () => {
      setText(SAMPLE);
      if (!$('sortFrom')) throw new Error('no Sort from character control (#sortFrom)');
      $('sortFrom').value = '6';
      fire($('sortFrom'), 'input');
      eq(boxes(), ['m', 'd', 'r', 'e', 'e']);
    });

    test('the stepper buttons move the box and stop at 1', async () => {
      setText(SAMPLE);
      setFrom(5);
      $('sortFromInc').click();
      eq(boxes(), ['m', 'd', 'r', 'e', 'e']);
      for (let i = 0; i < 6; i++) $('sortFromDec').click();
      eq($('sortFrom').value, '1');
      eq(boxes(), []);
    });

    test('lines too short for the character go to the bottom', async () => {
      setText('Dr. Lee\nAl\nMr. Kent\nBo');
      setFrom(5);
      eq(alphabetize(), 'Mr. Kent\nDr. Lee\nAl\nBo');
    });

    test('short lines stay at the bottom in Z to A order', async () => {
      setText('Dr. Lee\nAl\nMr. Kent\nBo');
      setFrom(5);
      $('orderDesc').click();
      eq(alphabetize(), 'Dr. Lee\nMr. Kent\nBo\nAl');
    });

    test('leading spaces are not counted', async () => {
      setText('   Dr. Smith\nMr. Rob');
      setFrom(5);
      eq(boxes(), ['S', 'R']);
      eq(alphabetize(), 'Mr. Rob\n   Dr. Smith');
    });

    test('an accented letter or an emoji counts as one character', async () => {
      setText(`e${ACUTE}xB\nabY\n\u{1F44D}\u{1F3FD}xC`);
      setFrom(3);
      eq(boxes(), ['B', 'Y', 'C']);
      eq(alphabetize(), `e${ACUTE}xB\n\u{1F44D}\u{1F3FD}xC\nabY`);
    });

    test('Find highlights and boxes show together', async () => {
      setText(SAMPLE);
      setFrom(5);
      setValue('findInput', 'Smith');
      eq([...doc.querySelectorAll('#backdropA mark')].map(el => el.textContent), ['Smith']);
      eq(boxes(), ['S', 'A', 'B', 'L', 'K']);
    });

    test('a Find match that splits a boxed character keeps the text intact', async () => {
      setText(`abcde${ACUTE}f`);
      setFrom(5);
      setValue('findInput', 'e');
      eq([...doc.querySelectorAll('#backdropA mark')].map(el => el.textContent), ['e']);
      eq(boxes(), []);
    });

    test('removing duplicates refreshes the boxes', async () => {
      setText('Dr. Smith\nDr. Smith\nMr. Adams');
      setFrom(5);
      $('dedupeBtn').click();
      eq(boxes(), ['S', 'A']);
    });

    test('after sorting with List numbering, the boxes skip the numbers', async () => {
      setText(SAMPLE);
      setFrom(5);
      $('swNumbering').click();
      eq(alphabetize(), '1. Mr. Adams\n2. Ms. Brown\n3. Mr. Kent\n4. Dr. Lee\n5. Dr. Smith');
      eq(boxes(), ['A', 'B', 'K', 'L', 'S']);
    });

    test('alphabetizing numbered output again leaves it unchanged', async () => {
      setText(SAMPLE);
      setFrom(5);
      $('swNumbering').click();
      alphabetize();
      eq(alphabetize(), '1. Mr. Adams\n2. Ms. Brown\n3. Mr. Kent\n4. Dr. Lee\n5. Dr. Smith');
    });

    test('custom text added at the start is skipped too', async () => {
      setText(SAMPLE);
      setFrom(5);
      setValue('customText', '- ');
      eq(alphabetize(), '- Mr. Adams\n- Ms. Brown\n- Mr. Kent\n- Dr. Lee\n- Dr. Smith');
      eq(boxes(), ['A', 'B', 'K', 'L', 'S']);
    });

    test('boxes never land on custom text added at the end', async () => {
      setText('Dr. Lee\nAl\nMr. Kent\nBob');
      setFrom(5);
      $('posEnd').click();
      setValue('customText', ', ');
      eq(alphabetize(), 'Mr. Kent, \nDr. Lee, \nAl, \nBob, ');
      eq(boxes(), ['K', 'L']);
    });

    test('boxes skip headings and numbers after Group by letter with List numbering', async () => {
      setText(SAMPLE);
      setFrom(5);
      $('swGroupLetter').click();
      $('swNumbering').click();
      eq(alphabetize(), 'A\n1. Mr. Adams\nB\n2. Ms. Brown\nK\n3. Mr. Kent\nL\n4. Dr. Lee\nS\n5. Dr. Smith');
      eq(boxes(), ['A', 'B', 'K', 'L', 'S']);
    });

    test('right after sorting, no boxes on lines a Transform rewrote', async () => {
      setText('Dr. Smith\nMr. Adams\nMs. Brown');
      setFrom(5);
      setTransform('slug');
      alphabetize();
      eq(boxes(), []);
    });

    test('right after sorting, boxes stay on lines a Transform only changed the case of', async () => {
      setText(SAMPLE);
      setFrom(5);
      setTransform('upper');
      eq(alphabetize(), 'MR. ADAMS\nMS. BROWN\nMR. KENT\nDR. LEE\nDR. SMITH');
      eq(boxes(), ['A', 'B', 'K', 'L', 'S']);
    });

    test('right after sorting, boxes follow lines that Trim spaces moved', async () => {
      setText('   Dr. Smith\nMr. Rob');
      setFrom(5);
      setTransform('trim');
      eq(alphabetize(), 'Mr. Rob\nDr. Smith');
      eq(boxes(), ['R', 'S']);
    });

    test('Group by letter headings use the boxed character', async () => {
      setText(SAMPLE);
      setFrom(5);
      $('swGroupLetter').click();
      eq(alphabetize(), 'A\nMr. Adams\nB\nMs. Brown\nK\nMr. Kent\nL\nDr. Lee\nS\nDr. Smith');
    });

    test('a Transform applies after the order is set from the text as typed', async () => {
      setText('Dr. Smith\nMr. Adams\nMs. Brown');
      setFrom(5);
      setTransform('slug');
      eq(alphabetize(), 'mr-adams\nms-brown\ndr-smith');
    });

    test('a delimiter splits items before counting', async () => {
      setText('Dr. Smith,Mr. Adams,Ms. Brown');
      setFrom(5);
      setValue('delimiter', ',');
      eq(boxes(), ['S', 'A', 'B']);
      eq(alphabetize(), 'Mr. Adams,Ms. Brown,Dr. Smith');
    });

    test('changing the delimiter after sorting recounts from the text', async () => {
      setText('Dr. Smith,Mr. Adams');
      setValue('delimiter', ',');
      setFrom(5);
      $('swNumbering').click();
      eq(alphabetize(), '1. Mr. Adams,2. Dr. Smith');
      eq(boxes(), ['A', 'S']);
      setValue('delimiter', '');
      eq(boxes(), ['r']);
    });

    test('Sort by number compares the numbers after the chosen character', async () => {
      setText('Item 10\nPart 9\nAxle 100');
      setFrom(6);
      $('swSortNumber').click();
      eq(alphabetize(), 'Part 9\nItem 10\nAxle 100');
    });

    test('compare mode sorts the second list the same way', async () => {
      $('swCompare').click();
      $('alphaToggle').click();
      setText(SAMPLE);
      setValue('textB', 'Dr. Lee\nMr. Adams');
      setFrom(5);
      $('primaryBtn').click();
      eq($('textB').value, 'Mr. Adams\nDr. Lee');
    });

    test('entries below 1 or left empty reset to a normal sort', async () => {
      setText(SAMPLE);
      setFrom(0);
      eq($('sortFrom').value, '1');
      setFrom('');
      eq($('sortFrom').value, '1');
      eq(boxes(), []);
      eq(alphabetize(), 'Dr. Lee\nDr. Smith\nMr. Adams\nMr. Kent\nMs. Brown');
    });

    test('the position is remembered when the popup reopens', async () => {
      setText(SAMPLE);
      setFrom(7);
      await wait(400);
      await load({ clear: false });
      eq($('sortFrom').value, '7');
      eq(boxes(), ['i', 'a', 'o', 'e', 'n']);
    });

    (async () => {
      const list = document.getElementById('results');
      let failed = 0;
      for (const t of tests) {
        const li = document.createElement('li');
        try {
          await load();
          await t.fn();
          // The highlight layer only works while its text matches the text
          // box exactly, so every test also checks nothing was duplicated.
          const layer = $('backdropA').textContent;
          if (layer !== '' && layer !== $('textA').value + '\n') {
            throw new Error('highlight layer text no longer matches the text box');
          }
          li.className = 'pass';
          li.textContent = `PASS  ${t.name}`;
        } catch (err) {
          failed++;
          li.className = 'fail';
          li.textContent = `FAIL  ${t.name}: ${err.message}`;
        }
        list.appendChild(li);
      }
      document.getElementById('summary').textContent = `${tests.length - failed} of ${tests.length} passed`;
      window.testResults = { passed: tests.length - failed, failed, lines: [...list.children].map(li => li.textContent) };
    })();
  </script>
</body>
</html>
